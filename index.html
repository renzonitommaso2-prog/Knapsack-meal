<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#222222">
    <title>Personal Dashboard</title>
    <style>
        /* Base Styles & Gray Background */
        body {
            margin: 0;
            padding: 0;
            font-family: Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #444444, #222222, #111111);
            background-attachment: fixed;
            color: #eeeeee;
            min-height: 100vh;
        }

        /* Top Navigation Bar */
        .top-nav {
            background: rgba(40, 40, 40, 0.8);
            border-bottom: 1px solid #111;
            padding: 10px 20px;
            display: flex;
            gap: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .top-nav a {
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
            padding: 5px 10px;
            border: 1px solid transparent;
        }
        .top-nav a:hover {
            background: rgba(255,255,255,0.1);
            border: 1px solid #555;
            color: #fff;
        }
        .top-nav a.active {
            background: rgba(255,255,255,0.15);
            border: 1px inset #555;
            color: #fff;
            font-weight: bold;
        }

        /* Layout */
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        
        h1 { font-weight: normal; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 30px;}

        /* App Shortcut Panels */
        .app-card {
            background: rgba(80, 80, 80, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 2px 4px 15px rgba(0, 0, 0, 0.6);
            border-radius: 0;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            display: block;
            color: inherit;
        }
        .app-card:hover {
            background: rgba(100, 100, 100, 0.45);
        }
        .app-card h2 { margin-top: 0; font-weight: normal; border-bottom: none;}
        .app-card p { color: #ccc; font-size: 13px; }
    </style>
</head>
<body>

<nav class="top-nav">
    <a href="index.html" class="active">Dashboard</a>
    <a href="meal-planner.html">Meal Planner</a>
    <a href="gym-tracker.html">Gym Tracker</a>
</nav>

<div class="container">
    <h1>Welcome to the Dashboard</h1>
    
    <div class="grid-2">
        <a href="meal-planner.html" class="app-card">
            <h2>Meal Planner</h2>
            <p>Track your daily macros and manage your recipe library.</p>
        </a>
        
        <a href="gym-tracker.html" class="app-card">
            <h2>Gym Tracker</h2>
            <p>Log your workouts and monitor your progress over time.</p>
        </a>
    </div>
</div>

</body>
</html>
